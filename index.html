<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아파트 단지 및 평수 정보 조회 (공공데이터)</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: #1e293b; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: var(--card); border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.05); padding: 30px; }
        h1 { font-size: 22px; color: var(--primary); margin-bottom: 6px; }
        p.sub { font-size: 14px; color: #64748b; margin-bottom: 20px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; outline: none; }
        input:focus { border-color: var(--primary); }
        button { padding: 12px 20px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .section { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
        .item { padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
        .item:hover { background: #eff6ff; border-color: var(--primary); }
        .item-name { font-weight: 600; font-size: 15px; }
        .item-sub { font-size: 13px; color: #64748b; }
        
        /* 상세 테이블 스타일 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background-color: #f1f5f9; color: #475569; font-weight: 600; }
        .badge { display: inline-block; padding: 2px 8px; background: #dbeafe; color: #1e40af; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .hidden { display: none; }
        .loading { text-align: center; color: #64748b; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏢 아파트 평수 & 단지 정보 조회</h1>
    <p class="sub">국토교통부 공공데이터 API 기반으로 정확한 아파트 단지 및 평형 정보를 가져옵니다.</p>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="아파트 이름 입력 (예: 반포자이, 은마, 헬리오시티)" onkeyup="if(event.keyCode==13) searchApt()">
        <button onclick="searchApt()">검색</button>
    </div>

    <!-- 검색 결과 목록 -->
    <div id="resultSection" class="section hidden">
        <div class="section-title">검색 결과 목록</div>
        <div id="aptList" class="list"></div>
    </div>

    <!-- 아파트 상세 및 평형 정보 -->
    <div id="detailSection" class="section hidden">
        <div class="section-title">
            <span id="selectedAptName">아파트 상세 정보</span>
            <span id="selectedAptCode" class="badge"></span>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>평형/전용면적</th>
                    <th>공용면적</th>
                    <th>공급면적 (평)</th>
                    <th>세대수</th>
                </tr>
            </thead>
            <tbody id="areaTableBody">
                <!-- API 데이터 삽입 위치 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // ⚠️ 발급받으신 공공데이터포털 서비스키(Decoding Key)를 아래에 넣어주세요.
    const SERVICE_KEY = 'xNrPdBZznFIQkrfCDOZZlmacnUxfk4tlrvJjLmEBNM+bPHwCo26D/5t0TsVKFaLkQI8ndlPkBL+cC5EZ6Qg8FA=='; 

    async function searchApt() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return alert('아파트 이름을 입력해주세요.');

        const listContainer = document.getElementById('aptList');
        const resultSection = document.getElementById('resultSection');
        const detailSection = document.getElementById('detailSection');

        resultSection.classList.remove('hidden');
        detailSection.classList.add('hidden');
        listContainer.innerHTML = '<div class="loading">공공데이터에서 검색 중...</div>';

        try {
            // 국토교통부 공동주택 단지 목록 조회 API
            const url = `https://apis.data.go.kr/1613000/AptListService2/getAptList?serviceKey=${encodeURIComponent(SERVICE_KEY)}&kaptName=${encodeURIComponent(query)}&pageNo=1&numOfRows=20`;
            
            const response = await fetch(url);
            const text = await response.text();
            
            // XML 응답 파싱
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(text, "text/xml");
            const items = xmlDoc.getElementsByTagName("item");

            listContainer.innerHTML = '';

            if (items.length === 0) {
                listContainer.innerHTML = '<div class="loading">검색된 아파트 단지가 없습니다.</div>';
                return;
            }

            for (let i = 0; i < items.length; i++) {
                const name = items[i].getElementsByTagName("kaptName")[0]?.textContent || "이름 없음";
                const code = items[i].getElementsByTagName("kaptCode")[0]?.textContent || "";
                const addr = items[i].getElementsByTagName("as1")[0]?.textContent || "";

                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <div>
                        <div class="item-name">${name}</div>
                        <div class="item-sub">${addr}</div>
                    </div>
                    <button style="padding: 6px 12px; font-size: 12px;" onclick="getAptDetail('${code}', '${name}')">상세조회</button>
                `;
                listContainer.appendChild(div);
            }
        } catch (error) {
            console.error(error);
            listContainer.innerHTML = '<div class="loading" style="color:red;">데이터를 불러오는 중 오류가 발생했습니다. API 키를 확인해 주세요.</div>';
        }
    }

    async function getAptDetail(kaptCode, aptName) {
        const detailSection = document.getElementById('detailSection');
        const tableBody = document.getElementById('areaTableBody');

        document.getElementById('selectedAptName').innerText = aptName;
        document.getElementById('selectedAptCode').innerText = `단지코드: ${kaptCode}`;
        detailSection.classList.remove('hidden');
        tableBody.innerHTML = '<tr><td colspan="4" class="loading">평형별 면적 정보 불러오는 중...</td></tr>';

        try {
            // 국토교통부 단지 상세/면적 정보 조회 API
            const url = `https://apis.data.go.kr/1613000/AptBasisInfoService1/getAptBasisInfo1?serviceKey=${encodeURIComponent(SERVICE_KEY)}&kaptCode=${kaptCode}`;
            
            const response = await fetch(url);
            const text = await response.text();
            
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(text, "text/xml");
            const item = xmlDoc.getElementsByTagName("item")[0];

            tableBody.innerHTML = '';

            if (!item) {
                tableBody.innerHTML = '<tr><td colspan="4" class="loading">상세 면적 정보가 제공되지 않는 단지입니다.</td></tr>';
                return;
            }

            // 전용면적별 세대수 및 면적 정보 추출
            const kaptArea = item.getElementsByTagName("kaptArea")[0]?.textContent || "-"; // 전용면적 합계
            const kaptMparea = item.getElementsByTagName("kaptMparea")[0]?.textContent || "-"; // 공급면적
            const kaptdaCnt = item.getElementsByTagName("kaptdaCnt")[0]?.textContent || "-"; // 세대수

            // 제곱미터(㎡)를 평수(평)로 환산 (1㎡ = 0.3025평)
            const pyung = kaptMparea !== "-" ? (parseFloat(kaptMparea) * 0.3025).toFixed(1) : "-";

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${kaptArea} ㎡</b></td>
                <td>-</td>
                <td><b>${kaptMparea} ㎡ (${pyung}평)</b></td>
                <td>${kaptdaCnt} 세대</td>
            `;
            tableBody.appendChild(tr);

        } catch (error) {
            console.error(error);
            tableBody.innerHTML = '<tr><td colspan="4" class="loading" style="color:red;">상세 정보를 불러올 수 없습니다.</td></tr>';
        }
    }
</script>

</body>
</html>
